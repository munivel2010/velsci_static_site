    window.addEventListener('load', () => {
      document.getElementById('code-textarea').value = velsciWebsiteCode;
      
      const iframe = document.getElementById('preview-iframe');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(velsciWebsiteCode);
      iframeDoc.close();
    });

    function switchTab(tab) {
      const previewView = document.getElementById('view-preview');
      const codeView = document.getElementById('view-code');
      const btnPreview = document.getElementById('btn-tab-preview');
      const btnCode = document.getElementById('btn-tab-code');

      if (tab === 'preview') {
        previewView.classList.remove('hidden');
        previewView.classList.add('flex');
        codeView.classList.add('hidden');
        codeView.classList.remove('flex');

        btnPreview.className = "px-4 py-1.5 text-xs font-medium rounded-md text-white bg-slate-700 shadow-sm transition-all flex items-center gap-2";
        btnCode.className = "px-4 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2";
      } else {
        codeView.classList.remove('hidden');
        codeView.classList.add('flex');
        previewView.classList.add('hidden');
        previewView.classList.remove('flex');

        btnCode.className = "px-4 py-1.5 text-xs font-medium rounded-md text-white bg-slate-700 shadow-sm transition-all flex items-center gap-2";
        btnPreview.className = "px-4 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2";
      }
    }

    function copyCodeToClipboard() {
      const codeText = document.getElementById('code-textarea').value;
      const hiddenInput = document.createElement('textarea');
      hiddenInput.value = codeText;
      document.body.appendChild(hiddenInput);
      hiddenInput.select();
      
      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (err) {
        console.error('Copy command failed', err);
      }
      document.body.removeChild(hiddenInput);

      if (success) {
        showToast();
      } else {
        alert('Code highlighted! Press Ctrl+C / Cmd+C to copy.');
      }
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      }, 3500);
    }

    function downloadCode() {
      const blob = new Blob([velsciWebsiteCode], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
