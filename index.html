<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velsci Globals - Precision Fit & AI Garment Patterns</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Special AI Feature Highlight Section Styling */
    .ai-feature-section {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      color: #ffffff;
      padding: 50px 20px;
      border-radius: 16px;
      margin: 40px auto;
      max-width: 900px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.3);
      text-align: center;
    }
    .ai-badge {
      background: linear-gradient(90deg, #d4af37, #f3e5ab);
      color: #000;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 15px;
    }
    .ai-feature-section h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #ffffff;
    }
    .ai-feature-section p {
      color: #d1d5db;
      max-width: 650px;
      margin: 0 auto 25px auto;
      font-size: 1rem;
      line-height: 1.6;
    }
    .upload-box {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #d4af37;
      padding: 30px 20px;
      border-radius: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    .file-input {
      margin-bottom: 20px;
      color: #d1d5db;
      width: 100%;
    }
    .btn-generate {
      background: linear-gradient(90deg, #d4af37, #aa7c11);
      color: #000;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .btn-generate:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .btn-generate:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 15px;
      font-weight: 500;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Special AI Feature Highlight Section -->
  <section class="ai-feature-section" id="ai-pattern-tool">
    <span class="ai-badge">✨ Special Feature</span>
    <h2>AI Pattern Generator</h2>
    <p>உங்களின் ஆடையின் புகைப்படத்தை அப்லோட் செய்யுங்கள்! எங்கள் AI பேக்ரவுண்டை நீக்கி, நீங்கள் அச்சிடக்கூடிய (Printable) துல்லியமான PDF Pattern-ஐ நொடிகளில் உருவாக்கும்.</p>
    
    <div class="upload-box">
      <form id="uploadForm">
        <input type="file" id="photoInput" class="file-input" accept="image/*" required>
        <button type="submit" id="uploadBtn" class="btn-generate">Generate PDF Pattern</button>
      </form>
      <div id="statusMessage"></div>
    </div>
  </section>

  <!-- JavaScript API Integration -->
  <script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const fileInput = document.getElementById('photoInput');
      const statusMessage = document.getElementById('statusMessage');
      const uploadBtn = document.getElementById('uploadBtn');

      if (fileInput.files.length === 0) {
        statusMessage.style.color = "#ef4444";
        statusMessage.innerText = "தயவுசெய்து ஒரு படத்தைத் தேர்ந்தெடுக்கவும்.";
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      statusMessage.style.color = "#f3e5ab";
      statusMessage.innerText = "படம் செயலாக்கப்படுகிறது... AI Pattern உருவாக்கப்படுகிறது...";
      uploadBtn.disabled = true;

      try {
        // Render API Endpoint
        const response = await fetch('YOUR_RENDER_API_URL/generate-pattern', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const blob = await response.blob();
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = 'garment-pattern.pdf';
          document.body.appendChild(a);
          a.click();
          a.remove();
          
          statusMessage.style.color = "#10b981";
          statusMessage.innerText = "சுப்பர்டா! உங்களின் PDF Pattern வெற்றிகரமாக டவுன்லோட் செய்யப்பட்டது!";
        } else {
          statusMessage.style.color = "#ef4444";
          statusMessage.innerText = "படத்தை செயலாக்குவதில் சிக்கல். மீண்டும் முயற்சிக்கவும்.";
        }
      } catch (error) {
        console.error('Error:', error);
        statusMessage.style.color = "#ef4444";
        statusMessage.innerText = "சர்வருடன் இணைப்பதில் பிழை ஏற்பட்டது.";
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
