<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velsci Fit — DIY & Local Tailor Pattern Engine</title>

  <!-- Security CSP Meta Tag -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://velsci-fit-backend.onrender.com;">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #051410; color: #f8fafc; }
    .glass-card { background: rgba(10, 35, 27, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(31, 83, 66, 0.5); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

  <!-- Security Access Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-2xl max-w-md w-full text-center space-y-4 border border-emerald-500/30">
      <div class="w-12 h-12 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center mx-auto text-amber-400 text-xl">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h3 class="text-xl font-bold text-white">Velsci Fit Secure Portal</h3>
      <p class="text-xs text-slate-300">Enter Access PIN to load Pattern Engine:</p>
      <input type="password" id="passcodeKey" placeholder="Enter Access PIN (e.g. 2026)" class="w-full px-4 py-2.5 rounded-lg bg-[#051410] border border-emerald-800 text-white text-center font-mono text-base focus:outline-none focus:border-amber-400">
      <button onclick="verifyAccess()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition-all">Authenticate & Access</button>
      <p id="errMsg" class="text-xs text-rose-400 hidden">Invalid Security Passcode!</p>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="protectedContent" class="max-w-5xl mx-auto w-full hidden space-y-6">
    
    <div class="flex justify-between items-center border-b border-emerald-800/60 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-scissors text-amber-400"></i> Velsci Fit — DIY & Tailor Engine
        </h1>
        <p class="text-xs text-slate-400">High-Precision Pattern Generation for Local Tailors & DIY Craftsmen</p>
      </div>
      <a href="index.html" class="px-3 py-1.5 bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-700/50 rounded-lg text-xs text-slate-200">
        ➔ Back to Main Site
      </a>
    </div>

    <!-- Controls Panel -->
    <div class="glass-card p-6 rounded-2xl space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        
        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">1. Flat-Lay Garment Image:</label>
          <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-emerald-800 file:text-white cursor-pointer">
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">2. Reference Object:</label>
          <select id="refTypeSelect" class="w-full px-3 py-2 rounded-lg bg-[#051410] border border-emerald-800 text-xs text-white focus:outline-none">
            <option value="coin" data-size="23">₹5 / 1€ Coin (23 mm)</option>
            <option value="card" data-size="85.6">Credit / ID Card (85.6 mm)</option>
            <option value="note" data-size="123">Currency Note (123 mm)</option>
            <option value="ruler" data-size="150">Ruler / Scale (150 mm)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">3. A4 Puzzle Grid Layout:</label>
          <select id="puzzleGridSelect" class="w-full px-3 py-2 rounded-lg bg-[#051410] border border-emerald-800 text-xs text-white focus:outline-none">
            <option value="3x3">3 x 3 (9 Pieces)</option>
            <option value="4x4" selected>4 x 4 (16 Pieces - Standard)</option>
            <option value="5x5">5 x 5 (25 Pieces)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">4. Seam Margin (%):</label>
          <input type="number" id="cuttingMargin" value="10" min="0" max="30" class="w-full px-3 py-2 rounded-lg bg-[#051410] border border-emerald-800 text-xs text-white focus:outline-none">
        </div>

      </div>

      <div class="flex flex-wrap gap-3 pt-2">
        <button id="processBtn" onclick="processWithRenderBackend()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition-all flex items-center gap-2">
          <i class="fa-solid fa-puzzle-piece"></i>
          <span>Generate Printable Pattern</span>
        </button>
        <button id="downloadBtn" onclick="downloadPattern()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition-all hidden flex items-center gap-2">
          <i class="fa-solid fa-file-arrow-down"></i>
          <span>Download A4 Puzzle Pattern</span>
        </button>
        <button id="downloadSvgBtn" onclick="downloadSvgVector()" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg text-xs transition-all hidden flex items-center gap-2">
          <i class="fa-solid fa-microchip"></i>
          <span>Export Laser/CNC Vector (DXF/SVG)</span>
        </button>
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="p-3 bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-lg text-xs font-mono text-center hidden"></div>

    <div id="patternOutput" class="glass-card p-5 rounded-xl border border-emerald-500/40 hidden">
      <h4 class="text-sm font-bold text-amber-400 mb-2">Automated Pattern Measurement Summary:</h4>
      <div id="outputDetails" class="text-xs text-slate-200 leading-relaxed font-mono space-y-1"></div>
    </div>

    <div class="glass-card p-4 rounded-2xl flex flex-col justify-center items-center overflow-auto">
      <img id="processedImgDisplay" class="max-w-full rounded-lg border border-dashed border-emerald-500/50 hidden" alt="Extracted Pattern">
    </div>

  </div>

  <script>
    const ACCESS_PIN = "2026";
    const RENDER_BACKEND_URL = "https://velsci-fit-backend.onrender.com/process-pattern";

    function verifyAccess() {
      const inputKey = document.getElementById("passcodeKey").value;
      if (inputKey === ACCESS_PIN) {
        document.getElementById("authModal").classList.add("hidden");
        document.getElementById("protectedContent").classList.remove("hidden");
      } else {
        document.getElementById("errMsg").classList.remove("hidden");
      }
    }

    let base64Image = null;
    let resultBase64 = null;
    let svgVectorData = null;

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 10 * 1024 * 1024) {
          alert("File size exceeds 10MB limit.");
          return;
        }
        const reader = new FileReader();
        reader.onload = function(event) {
          base64Image = event.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    async function processWithRenderBackend() {
      if (!base64Image) {
        alert("Please upload a garment image first!");
        return;
      }

      const statusBox = document.getElementById('statusBox');
      const processBtn = document.getElementById('processBtn');
      const refSelect = document.getElementById('refTypeSelect');
      const selectedOption = refSelect.options[refSelect.selectedIndex];
      
      const gridVal = document.getElementById('puzzleGridSelect').value.split('x');
      const rows = parseInt(gridVal[0]);
      const cols = parseInt(gridVal[1]);

      statusBox.classList.remove('hidden');
      statusBox.innerText = "⏳ Extracting Garment Contour & Generating Secure Pattern Output...";
      processBtn.disabled = true;

      const payload = {
        image: base64Image,
        ref_type: refSelect.value,
        known_width_mm: parseFloat(selectedOption.getAttribute('data-size')),
        margin: parseFloat(document.getElementById('cuttingMargin').value),
        grid_rows: rows,
        grid_cols: cols
      };

      try {
        const response = await fetch(RENDER_BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
          statusBox.className = "p-3 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 rounded-lg text-xs font-mono text-center";
          statusBox.innerText = "✓ Processing Complete! Contour & Printable Pattern Multi-Format Export Ready.";

          resultBase64 = data.processed_image;
          svgVectorData = data.svg_dxf_vector;

          const imgEl = document.getElementById('processedImgDisplay');
          imgEl.src = resultBase64;
          imgEl.classList.remove('hidden');

          document.getElementById('downloadBtn').classList.remove('hidden');
          document.getElementById('downloadSvgBtn').classList.remove('hidden');

          const detailsContainer = document.getElementById('outputDetails');
          detailsContainer.textContent = ""; // Secure Text Node Rendering (Anti-XSS)

          const p1 = document.createElement('div');
          p1.textContent = `• Measured Bounding Width: ${data.measured_width_cm} cm`;
          const p2 = document.createElement('div');
          p2.textContent = `• Measured Bounding Height: ${data.measured_height_cm} cm`;
          const p3 = document.createElement('div');
          p3.textContent = `• Numbered Puzzle Tiles: ${data.total_puzzle_pieces} Pieces (A4 Cut-Ready)`;
          const p4 = document.createElement('div');
          p4.className = "pt-2 text-sm text-amber-400 font-bold";
          p4.textContent = `➔ Total Estimated Fabric Needed: ${data.required_meters} Meters`;

          detailsContainer.appendChild(p1);
          detailsContainer.appendChild(p2);
          detailsContainer.appendChild(p3);
          detailsContainer.appendChild(p4);

          document.getElementById('patternOutput').classList.remove('hidden');
        } else {
          throw new Error(data.error || "Processing failed.");
        }
      } catch (err) {
        statusBox.className = "p-3 bg-rose-500/20 border border-rose-500/40 text-rose-300 rounded-lg text-xs font-mono text-center";
        statusBox.innerText = `❌ Connection Error: ${err.message}. Please retry.`;
      } finally {
        processBtn.disabled = false;
      }
    }

    function downloadPattern() {
      if (!resultBase64) return;
      const a = document.createElement('a');
      a.href = resultBase64;
      a.download = 'velsci-fit-printable-pattern.jpg';
      a.click();
    }

    function downloadSvgVector() {
      if (!svgVectorData) return;
      const blob = new Blob([svgVectorData], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'velsci-fit-laser-pattern.svg';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
