<!DOCTYPE html>
<html lang="ta" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velsci Fit — Secure Pattern & Fabric Estimator</title>

  <!-- Security Meta Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { font-family: sans-serif; background-color: #051410; color: #f8fafc; }
    .glass-card { background: rgba(10, 35, 27, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(31, 83, 66, 0.5); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

  <!-- Security Access Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-2xl max-w-md w-full text-center space-y-4 border border-emerald-500/30">
      <div class="w-12 h-12 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center mx-auto text-amber-400 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h3 class="text-xl font-bold text-white">Velsci Fit Access Control</h3>
      <p class="text-xs text-slate-300">இந்த டூலை பயன்படுத்த Passcode உள்ளிடவும்:</p>
      <input type="password" id="passcodeKey" placeholder="Enter Access PIN (e.g. 2026)" class="w-full px-4 py-2.5 rounded-lg bg-[#051410] border border-emerald-800 text-white text-center font-mono text-base focus:outline-none focus:border-amber-400">
      <button onclick="verifyAccess()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition-all">Access Tool</button>
      <p id="errMsg" class="text-xs text-rose-400 hidden">தவறான பாஸ்கோடு! மீண்டும் முயலவும்.</p>
    </div>
  </div>

  <!-- Protected Velsci Fit Workspace -->
  <div id="protectedContent" class="max-w-5xl mx-auto w-full hidden space-y-6">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center border-b border-emerald-800/60 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-scissors text-amber-400"></i> Velsci Fit Pattern & Fabric Estimator
        </h1>
        <p class="text-xs text-slate-400">On-Demand Zero-Waste Precision Pattern Tool</p>
      </div>
      <a href="index.html" class="px-3 py-1.5 bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-700/50 rounded-lg text-xs text-slate-200">
        ➔ Back to Main Site
      </a>
    </div>

    <!-- Tool Control Panel -->
    <div class="glass-card p-6 rounded-2xl space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        
        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">1. ஆடை படம் (Image):</label>
          <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-emerald-800 file:text-white hover:file:bg-emerald-700 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">2. துணி ரோல் அகலம்:</label>
          <select id="fabricWidthSelect" class="w-full px-3 py-2 rounded-lg bg-[#051410] border border-emerald-800 text-xs text-white focus:outline-none">
            <option value="44" selected>44 Inches / 112 cm (India Standard)</option>
            <option value="36">36 Inches / 90 cm (Small Width)</option>
            <option value="60">60 Inches / 152 cm (Global Width)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">3. ஆடை உயரம் (cm):</label>
          <input type="number" id="targetHeightCm" value="100" class="w-full px-3 py-2 rounded-lg bg-[#051410] border border-emerald-800 text-xs text-white focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">4. ஆடை அகலம் (cm):</label>
          <input type="number" id="targetWidthCm" value="80" class="w-full px-3 py-2 rounded-lg bg-[#051410] border border-emerald-800 text-xs text-white focus:outline-none">
        </div>

      </div>

      <div class="flex flex-wrap gap-3 pt-2">
        <button onclick="generatePatternAndEstimate()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition-all">
          Generate Pattern & Estimate Fabric
        </button>
        <button onclick="downloadCanvas()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition-all">
          Download Pattern PDF / Image
        </button>
      </div>
    </div>

    <!-- Output Calculation Card -->
    <div id="estimationResult" class="glass-card p-5 rounded-xl border border-emerald-500/40 hidden">
      <h4 class="text-sm font-bold text-amber-400 mb-2">Fabric Requirement Estimation (துணி தேவை மதிப்பீடு):</h4>
      <p id="fabricEstimateText" class="text-xs text-slate-200 leading-relaxed"></p>
    </div>

    <!-- Canvas Workspace -->
    <div class="glass-card p-4 rounded-2xl flex justify-center items-center overflow-auto">
      <canvas id="patternCanvas" class="max-w-full rounded-lg border border-dashed border-emerald-500/50"></canvas>
    </div>

  </div>

  <script>
    const ACCESS_PIN = "2026";

    function verifyAccess() {
      const inputKey = document.getElementById("passcodeKey").value;
      if (inputKey === ACCESS_PIN) {
        document.getElementById("authModal").classList.add("hidden");
        document.getElementById("protectedContent").classList.remove("hidden");
      } else {
        document.getElementById("errMsg").classList.remove("hidden");
      }
    }

    let uploadedImage = null;

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImage = new Image();
          uploadedImage.onload = function() {
            const canvas = document.getElementById('patternCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;
            ctx.drawImage(uploadedImage, 0, 0);
          }
          uploadedImage.src = event.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    function generatePatternAndEstimate() {
      if (!uploadedImage) {
        alert("முதலில் ஒரு படத்தை பதிவேற்றவும்!");
        return;
      }

      const canvas = document.getElementById('patternCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      ctx.drawImage(uploadedImage, 0, 0);

      // Grid Lines
      const gridSize = 100;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.font = 'bold 20px Arial';
      ctx.fillStyle = '#f59e0b';

      let count = 1;
      for (let x = 0; x < width; x += gridSize) {
        for (let y = 0; y < height; y += gridSize) {
          ctx.strokeRect(x, y, gridSize, gridSize);
          ctx.fillText(count.toString(), x + 10, y + 30);
          count++;
        }
      }

      // Calculations
      const rollWidthInches = parseFloat(document.getElementById('fabricWidthSelect').value);
      const rollWidthCm = rollWidthInches * 2.54;
      const targetWidthCm = parseFloat(document.getElementById('targetWidthCm').value) || 80;
      const targetHeightCm = parseFloat(document.getElementById('targetHeightCm').value) || 100;

      const marginFactor = 1.10; // 10% Cutting margin
      const panelsAcrossWidth = Math.floor(rollWidthCm / targetWidthCm);
      
      let requiredLengthCm = (panelsAcrossWidth >= 1) ? targetHeightCm * marginFactor : targetHeightCm * Math.ceil(targetWidthCm / rollWidthCm) * marginFactor;
      
      const requiredMeters = (requiredLengthCm / 100).toFixed(2);
      const requiredYards = (requiredMeters * 1.09361).toFixed(2);

      const resultDiv = document.getElementById('estimationResult');
      document.getElementById('fabricEstimateText').innerHTML = `
        <b>தேர்ந்தெடுக்கப்பட்ட துணி ரோல் அகலம்:</b> ${rollWidthInches} அங்குலம் (${rollWidthCm.toFixed(1)} cm)<br>
        <b>ஆடை அளவு (Width x Height):</b> ${targetWidthCm} cm x ${targetHeightCm} cm<br>
        <b>தேவைப்படும் மொத்த துணி நீளம்:</b> <span class="text-amber-400 font-bold text-sm">${requiredMeters} மீட்டர்கள் (${requiredYards} Yards)</span> 
        <small class="text-slate-400">(10% தையல் & கட்டிங் மார்ஜின் சேர்த்து)</small>
      `;
      resultDiv.classList.remove('hidden');
    }

    function downloadCanvas() {
      const canvas = document.getElementById('patternCanvas');
      const link = document.createElement('a');
      link.download = 'velsci-fit-pattern-estimate.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
