<script>
  let scene, camera, renderer, garmentMesh;
  let isWireframe = false;
  let currentGarmentType = 'top';
  let uploadedImages = [];

  const STANDARD_PRESETS = {
    'S':   { chest: 92,  waist: 76,  hips: 94,  shoulder: 42, sleeve: 61, length: 70, collar: 37, armhole: 23, height: 168 },
    'M':   { chest: 98,  waist: 82,  hips: 98,  shoulder: 44, sleeve: 62.5, length: 72, collar: 39, armhole: 24.5, height: 172 },
    'L':   { chest: 104, waist: 88,  hips: 102, shoulder: 46, sleeve: 64, length: 74, collar: 41, armhole: 26, height: 176 },
    'XL':  { chest: 112, waist: 96,  hips: 110, shoulder: 48, sleeve: 65.5, length: 78, collar: 43, armhole: 28, height: 180 },
    'XXL': { chest: 120, waist: 104, hips: 118, shoulder: 50, sleeve: 67, length: 80, collar: 45, armhole: 30, height: 184 }
  };

  function handleMultipleImages(files) {
    if (!files || files.length === 0) return;

    Array.from(files).forEach((file) => {
      if (!file.type.startsWith('image/')) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          uploadedImages.push({ id: Date.now() + Math.random(), img: img, src: e.target.result });
          renderImageGallery();
          updatePatternAnd3D();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function removeImage(id) {
    uploadedImages = uploadedImages.filter(item => item.id !== id);
    renderImageGallery();
    updatePatternAnd3D();
  }

  function renderImageGallery() {
    const gallery = document.getElementById('imageGallery');
    gallery.innerHTML = '';

    uploadedImages.forEach((item) => {
      const wrap = document.createElement('div');
      wrap.className = 'relative group w-16 h-16 rounded-lg overflow-hidden border border-brand-700 bg-brand-900';

      const img = document.createElement('img');
      img.src = item.src;
      img.className = 'w-full h-full object-cover';

      const removeBtn = document.createElement('button');
      removeBtn.innerHTML = '&times;';
      removeBtn.className = 'absolute top-0 right-0 bg-red-600/90 hover:bg-red-700 text-white w-5 h-5 flex items-center justify-center text-xs font-bold rounded-bl';
      removeBtn.onclick = (e) => { e.stopPropagation(); removeImage(item.id); };

      wrap.appendChild(img);
      wrap.appendChild(removeBtn);
      gallery.appendChild(wrap);
    });
  }

  const dropZone = document.getElementById('dropZone');
  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('border-brand-gold'); }, false);
  });
  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('border-brand-gold'); }, false);
  });
  dropZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    if (dt && dt.files) handleMultipleImages(dt.files);
  }, false);

  function applyStandardPreset(sizeKey) {
    const preset = STANDARD_PRESETS[sizeKey];
    if (!preset) return;

    document.getElementById('totalHeight').value = preset.height;
    document.getElementById('chest').value = preset.chest;
    document.getElementById('waist').value = preset.waist;
    document.getElementById('hips').value = preset.hips;
    document.getElementById('shoulder').value = preset.shoulder;
    document.getElementById('sleeve').value = preset.sleeve;
    document.getElementById('length').value = preset.length;
    document.getElementById('collar').value = preset.collar;
    document.getElementById('armhole').value = preset.armhole;

    calculateInseamEstimation();
    updatePatternAnd3D();
  }

  function calculateInseamEstimation() {
    const height = parseFloat(document.getElementById('totalHeight').value) || 175;
    const outseam = (height * 0.62).toFixed(1);
    document.getElementById('estimatedOutseamBadge').textContent = `Waist-to-Foot: ${outseam} cm`;
    if (currentGarmentType === 'pants') {
      document.getElementById('length').value = parseFloat(outseam);
    }
  }

  function setGarmentType(type) {
    currentGarmentType = type;
    document.getElementById('btnTypePants').className = type === 'pants' ? "py-2 rounded-lg bg-brand-gold text-brand-950 transition-all" : "py-2 rounded-lg text-slate-300 hover:text-white transition-all";
    document.getElementById('btnTypeTop').className = type === 'top' ? "py-2 rounded-lg bg-brand-gold text-brand-950 transition-all" : "py-2 rounded-lg text-slate-300 hover:text-white transition-all";
    calculateInseamEstimation();
    updatePatternAnd3D();
  }

  function init3D() {
    const container = document.getElementById('threeCanvasContainer');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x051410);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 160);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.innerHTML = ''; 
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xe2b857, 1.0);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    create3DGarmentMesh();

    let isDragging = false;
    let previousMouseX = 0;

    container.addEventListener('mousedown', (e) => { isDragging = true; previousMouseX = e.clientX; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    container.addEventListener('mousemove', (e) => {
      if (isDragging && garmentMesh) {
        garmentMesh.rotation.y += (e.clientX - previousMouseX) * 0.01;
        previousMouseX = e.clientX;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging && garmentMesh) {
        garmentMesh.rotation.y += 0.003;
      }
      renderer.render(scene, camera);
    }
    animate();
  }

  function cleanupGarmentMesh() {
    if (garmentMesh) {
      garmentMesh.traverse((child) => {
        if (child.isMesh) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
            else child.material.dispose();
          }
        }
      });
      scene.remove(garmentMesh);
    }
  }

  function create3DGarmentMesh() {
    if (!scene) return;
    cleanupGarmentMesh();

    const waistVal = parseFloat(document.getElementById('waist').value) || 88;
    const hipsVal = parseFloat(document.getElementById('hips').value) || 102;
    const lengthVal = parseFloat(document.getElementById('length').value) || 74;

    garmentMesh = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
      color: 0x2d735d,
      roughness: 0.4,
      metalness: 0.1,
      wireframe: isWireframe,
      side: THREE.DoubleSide
    });

    if (currentGarmentType === 'pants') {
      const legRadiusTop = Math.max(hipsVal * 0.07, 1);
      const legRadiusBottom = Math.max(legRadiusTop * 0.75, 1);
      const legHeight = Math.max(lengthVal * 0.8, 10);

      const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(legRadiusTop, legRadiusBottom, legHeight, 24), mat);
      leftLeg.position.x = -legRadiusTop * 1.1;
      
      const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(legRadiusTop, legRadiusBottom, legHeight, 24), mat);
      rightLeg.position.x = legRadiusTop * 1.1;

      const waistBand = new THREE.Mesh(new THREE.CylinderGeometry(hipsVal * 0.14, waistVal * 0.13, 12, 24), mat);
      waistBand.position.y = legHeight / 2 + 6;

      garmentMesh.add(leftLeg, rightLeg, waistBand);
    } else {
      const topRadius = Math.max((parseFloat(document.getElementById('chest').value) || 104) * 0.15, 1);
      const bottomRadius = Math.max(waistVal * 0.14, 1);
      const height = Math.max(lengthVal * 0.8, 10);

      garmentMesh.add(new THREE.Mesh(new THREE.CylinderGeometry(topRadius, bottomRadius, height, 32, 16, true), mat));
    }

    scene.add(garmentMesh);
  }

  function toggleWireframe() {
    isWireframe = !isWireframe;
    create3DGarmentMesh();
  }

  function toggleModal(id) {
    document.getElementById(id).classList.toggle('hidden');
  }

  function updatePatternAnd3D() {
    const height = parseFloat(document.getElementById('totalHeight').value) || 176;
    const chest = parseFloat(document.getElementById('chest').value) || 104;
    const waist = parseFloat(document.getElementById('waist').value) || 88;
    const hips = parseFloat(document.getElementById('hips').value) || 102;
    const shoulder = parseFloat(document.getElementById('shoulder').value) || 46;
    const length = parseFloat(document.getElementById('length').value) || 74;
    const collar = parseFloat(document.getElementById('collar').value) || 41;
    const armhole = parseFloat(document.getElementById('armhole').value) || 26;
    const stretch = parseFloat(document.getElementById('stretch').value) || 0.10;
    const seam = parseFloat(document.getElementById('seam').value) || 1.5;

    create3DGarmentMesh();

    const canvas = document.getElementById('patternCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const scale = 3.8;
    const adjWaist = waist * (1.0 - stretch);
    const adjHips = hips * (1.0 - stretch);

    canvas.width = Math.max((hips + 20) * scale, 300);
    canvas.height = Math.max((length + 20) * scale, 300);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (uploadedImages.length > 0 && uploadedImages[0].img && uploadedImages[0].img.width > 0) {
      const primImg = uploadedImages[0].img;
      const thumbW = canvas.width * 0.22;
      const thumbH = (primImg.height / primImg.width) * thumbW;
      if (!isNaN(thumbH) && thumbH > 0) {
        ctx.globalAlpha = 0.22;
        ctx.drawImage(primImg, 15, 15, thumbW, thumbH);
        ctx.globalAlpha = 1.0;
      }
    }

    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

    ctx.setLineDash([]);
    ctx.strokeStyle = "#051410";
    ctx.lineWidth = 3;
    ctx.beginPath();

    const startX = canvas.width / 2;

    if (currentGarmentType === 'pants') {
      const halfWaist = (adjWaist * scale) / 4;
      const halfHips = (adjHips * scale) / 4;
      const legBottom = halfHips * 0.7;

      ctx.moveTo(startX - halfWaist, 30);
      ctx.lineTo(startX + halfWaist, 30);
      ctx.lineTo(startX + halfHips, 90);
      ctx.lineTo(startX + halfHips + 20, 160);
      ctx.lineTo(startX + legBottom, canvas.height - 30);
      ctx.lineTo(startX - legBottom, canvas.height - 30);
      ctx.lineTo(startX - halfHips, 160);
      ctx.lineTo(startX - halfWaist, 30);
      ctx.stroke();

      ctx.fillStyle = "#64748b";
      ctx.font = "10px sans-serif";
      ctx.fillText(`Velsci Pants Pattern | Height: ${height}cm | Outseam: ${length}cm | Seam: ${seam}cm`, 15, canvas.height - 10);
    } else {
      const adjChest = chest * (1.0 - stretch);
      const halfShoulder = (shoulder * scale) / 2;
      const halfChest = (adjChest * scale) / 4;
      const halfWaist = (adjWaist * scale) / 4;
      const neckRadius = (collar / (2 * Math.PI)) * scale;
      const armholeDrop = armhole * scale * 0.85;

      ctx.arc(startX, 25, neckRadius, 0, Math.PI, false);
      ctx.moveTo(startX - neckRadius, 25);
      ctx.lineTo(startX - halfShoulder, 42);
      ctx.moveTo(startX + neckRadius, 25);
      ctx.lineTo(startX + halfShoulder, 42);
      ctx.lineTo(startX + halfChest, 42 + armholeDrop);
      ctx.lineTo(startX + halfWaist, 210);
      ctx.lineTo(startX + halfWaist, canvas.height - 25);
      ctx.lineTo(startX - halfWaist, canvas.height - 25);
      ctx.lineTo(startX - halfWaist, 210);
      ctx.lineTo(startX - halfChest, 42 + armholeDrop);
      ctx.lineTo(startX - halfShoulder, 42);
      ctx.stroke();

      ctx.fillStyle = "#64748b";
      ctx.font = "10px sans-serif";
      ctx.fillText(`Velsci Top Pattern | Height: ${height}cm | Chest: ${chest}cm | Collar: ${collar}cm | Seam: ${seam}cm`, 15, canvas.height - 10);
    }
  }

  function downloadPattern() {
    const canvas = document.getElementById('patternCanvas');
    const link = document.createElement('a');
    link.download = `Velsci_${currentGarmentType}_Pattern.png`;
    link.href = canvas.toDataURL();
    link.click();
  }

  window.addEventListener('DOMContentLoaded', () => {
    init3D();
    calculateInseamEstimation();
    updatePatternAnd3D();
  });
</script>
